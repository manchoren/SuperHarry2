{% extends "memories/base.html" %}
{% block title %}Previous CSV results{% endblock %}
{% block content %}
  <h1>Previous CSV results</h1>
  {% if files %}
    <h2>Your CSV files</h2>
    <ul>
      {% for record in files %}
        <li>File #{{ record.pk }}: <a href="{% url 'csv-detail' record.pk %}">{{ record.name }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
