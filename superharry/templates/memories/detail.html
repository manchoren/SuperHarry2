{% extends 'ui/base.html' %}
{% block title %}Saved memory{% endblock %}
{% block ui_content %}
<nav aria-label="Breadcrumb"><a href="{% url 'memories' %}">Saved memories</a></nav>
<header class="sh-heading"><div><h1>Saved memory</h1><p class="sh-muted">Private to your account.</p></div></header>
<article class="sh-card"><p>{{ object.content }}</p></article>
<div class="sh-actions" style="margin-top: 1rem">
  <a class="sh-button sh-button-secondary" href="{% url 'memory-edit' object.pk %}">Edit</a>
  <a class="sh-button sh-button-danger" href="{% url 'memory-delete' object.pk %}">Delete</a>
</div>
{% endblock %}
