{% extends 'ui/base.html' %}
{% block title %}Delete memory{% endblock %}
{% block ui_content %}
<nav aria-label="Breadcrumb"><a href="{% url 'memories' %}">Saved memories</a></nav>
<header class="sh-heading"><div><h1>Delete memory?</h1><p class="sh-muted">This permanently removes the memory from your account.</p></div></header>
<article class="sh-card"><p>{{ object.content }}</p></article>
<form method="post" class="sh-actions" style="margin-top: 1rem">
  {% csrf_token %}
  <button class="sh-button sh-button-danger" type="submit">Delete memory</button>
  <a class="sh-button sh-button-secondary" href="{% url 'memories' %}">Cancel</a>
</form>
{% endblock %}
