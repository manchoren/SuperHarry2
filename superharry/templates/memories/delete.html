{% extends "memories/base.html" %}

{% block title %}Delete memory{% endblock %}

{% block content %}
  <h1>Delete memory?</h1>
  <article><p>{{ object.content }}</p></article>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete memory</button>
    <a href="{% url 'memories' %}">Cancel</a>
  </form>
{% endblock %}
