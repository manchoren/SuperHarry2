{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SuperHarry2{% endblock %} · SuperHarry2</title>
  <link rel="stylesheet" href="{% static 'superharry/chat.css' %}">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'superharry/components.css' %}">
  <script src="{% static 'superharry/theme.js' %}"></script>
</head>
<body class="{% block body_class %}app-shell sh{% endblock %}">
  {% block navigation %}{% include 'includes/navigation.html' %}{% endblock %}
  <main class="main-content">
    {% block content %}{% block ui_content %}{% endblock %}{% endblock %}
  </main>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
