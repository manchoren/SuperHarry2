name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-components:
    name: Shared UI and migrated routes
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: superharry.settings
      DJANGO_SECRET_KEY: ci-only-synthetic-signing-key
      UI_COMPONENT_CATALOG_ENABLED: '1'
      UI_AXE_PATH: ${{ runner.temp }}/ui-axe/node_modules/axe-core/axe.min.js
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install UI smoke dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Install axe-core
        run: npm install --prefix "$RUNNER_TEMP/ui-axe" axe-core@4.10.3
      - name: Set the installed Chromium path
        shell: bash
        run: |
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "UI_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Exercise the catalog and Accounts
        run: python -m tests.ui_account_management_smoke
      - name: Exercise sign-in and required password change
        run: python -m tests.ui_auth_smoke
      - name: Exercise Chat
        env:
          UI_CHAT_ONLY: '1'
        run: python -m tests.ui_browser_smoke
      - name: Exercise Folders navigation and roles
        run: python -m tests.ui_folders_navigation_smoke
      - name: Exercise file history and previews
        run: |
          python -m tests.ui_file_history_mobile_smoke
          python -m tests.ui_file_preview_smoke
      - name: Exercise Memories, Settings and CSV
        run: |
          python -m tests.ui_memories_csv_smoke
          python -m tests.ui_profile_smoke
      - name: Exercise Skills and browser consent
        run: python -m tests.ui_browser_session_smoke
      - name: Exercise Schedules
        run: python -m tests.ui_schedule_smoke

  application:
    name: Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      DJANGO_SETTINGS_MODULE: superharry.settings
      DJANGO_SECRET_KEY: ci-only-synthetic-signing-key
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check changed lines for whitespace errors
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BASE" ;;
            *) base="" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git show --format= --check "$GITHUB_SHA"
          else
            git cat-file -e "${base}^{commit}"
            git diff --check "$base" "$GITHUB_SHA"
          fi
      - name: Check undefined Python names
        run: python -m ruff check --select F821,F822,F823 .
      - name: Check Django configuration
        run: python -m django check
      - name: Check migrations
        run: python -m django makemigrations --check --dry-run
      - name: Run Django tests
        run: python -m django test --verbosity 1

  sandbox:
    name: Docker sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: superharry.settings
      DJANGO_SECRET_KEY: ci-only-synthetic-signing-key
      SKILL_SMOKE_UNSUPPORTED_RUNTIME: '0'
      SKILL_TEST_WHEEL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.10.0
      - name: Verify sandbox runtime policy
        run: python -c "from scripts.run_skill_jobs import validate_runtime; validate_runtime()"
      - name: Build isolated worker image
        run: |
          docker build --target skill-worker -t superharry-skill-worker:local .
          docker tag superharry-skill-worker:local superharry-skill-network-test:local
      - name: Check CSV skill through chat
        env:
          SKILL_NETWORK_DOCKER_SMOKE: '1'
        run: python -m django test tests.test_agent_skill_docker.AgentSkillDockerTests.test_chat_csv_attachment_runs_in_docker_and_result_is_private
      - name: Check skill sandbox
        run: python -m tests.skill_sandbox_smoke
      - name: Check skill preparation and execution
        run: python -m tests.skill_preparation_smoke
      - name: Check mediated skill network
        run: python -m tests.skill_network_sandbox_smoke
      - name: Check skill network integration
        env:
          SKILL_NETWORK_DOCKER_SMOKE: '1'
        run: python -m django test tests.test_skill_network_docker --verbosity 1
