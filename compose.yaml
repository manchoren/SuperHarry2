services:
  scheduler:
    build: .
    restart: unless-stopped
    command: ["sh", "-ec", "while :; do if python -m django migrate --check >/dev/null 2>&1; then python -m django recover_skill_dispatch || true; python -m django run_schedules || true; fi; sleep 30; done"]
    environment:
      DJANGO_DATABASE_PATH: /data/db.sqlite3
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Guayaquil}
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    volumes:
      - django_data:/data
    secrets:
      - django_secret_key
    depends_on:
      - django
  django:
    build: .
    ports:
      - "127.0.0.1:${SUPERHARRY_PORT:-8000}:8000"
    environment:
      DJANGO_DATABASE_PATH: /data/db.sqlite3
      DJANGO_AVATAR_MAX_BYTES: ${DJANGO_AVATAR_MAX_BYTES:-2097152}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Guayaquil}
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      RECOVERY_PASSWORD_FILE: /run/secrets/recovery_password
    volumes:
      - django_data:/data
    secrets:
      - django_secret_key
      - recovery_password

volumes:
  django_data:

secrets:
  django_secret_key:
    file: ${DJANGO_SECRET_KEY_PATH:-.secrets/django_secret_key}
  recovery_password:
    file: ${RECOVERY_PASSWORD_PATH:-.secrets/recovery_password}
